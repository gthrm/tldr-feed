name: tldr-feed

services:
  rsshub:
    image: ghcr.io/diygod/rsshub:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory
      CACHE_EXPIRE: '900'
      # The Pi shares 8 GB with grafana/prometheus/pihole — one browser at a time.
      PUPPETEER_MAX_CONCURRENCY: '1'
      REQUEST_TIMEOUT: '20000'
      ALLOW_USER_HOTLINK_TEMPLATE: 'false'
    # Bound to loopback only: newsbot reaches it by service name, not via the LAN.
    ports:
      - '127.0.0.1:1200:1200'
    mem_limit: 1g
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS -o /dev/null http://localhost:1200/ || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      RSSHUB_BASE_URL: http://rsshub:1200
      TZ: Europe/Belgrade
    depends_on:
      rsshub:
        condition: service_healthy
    # Chromium for the one browser-backed source needs headroom; 512m gets the
    # container OOM-killed mid-poll (exit 137).
    mem_limit: 1500m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  daily-api:
    # The page and email of the bot's ten, at 10:30. Selects nothing itself.
    build:
      context: .
      dockerfile: apps/daily-api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Belgrade
      RSSHUB_BASE_URL: http://rsshub:1200
    volumes:
      - ./apps/daily-api/data:/app/data
      - site:/public
    depends_on:
      rsshub:
        condition: service_healthy
    # jsdom over a day's worth of articles is the peak; the site build is small.
    mem_limit: 1g
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  # Serves last night's build. Bound to loopback: the way in is the Cloudflare
  # tunnel already running on the Pi.
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:3091:80'
    volumes:
      - site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      daily-api:
        condition: service_healthy
    mem_limit: 64m
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

volumes:
  site:
  caddy-data:
